<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#111927"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#162234"/>
      <stop offset="100%" stop-color="#0d1522"/>
    </linearGradient>
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#7C4DFF"/>
    </linearGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <rect width="1200" height="675" fill="none" stroke="#243247" stroke-width="2"/>

  <!-- Subtle Grid -->
  <g opacity="0.08" stroke="#00E5FF" stroke-width="1">
    <path d="M0 75 H1200 M0 150 H1200 M0 225 H1200 M0 300 H1200 M0 375 H1200 M0 450 H1200 M0 525 H1200 M0 600 H1200"/>
    <path d="M100 0 V675 M200 0 V675 M300 0 V675 M400 0 V675 M500 0 V675 M600 0 V675 M700 0 V675 M800 0 V675 M900 0 V675 M1000 0 V675 M1100 0 V675"/>
  </g>

  <!-- Header Bar -->
  <rect x="0" y="0" width="1200" height="65" fill="#131c2e" stroke="#243247" stroke-width="1"/>
  <rect x="25" y="15" width="36" height="36" rx="8" fill="url(#cyanPurple)" filter="url(#glowCyan)"/>
  <text x="43" y="39" fill="#000" font-family="sans-serif" font-weight="900" font-size="19" text-anchor="middle">S</text>
  <text x="75" y="38" fill="#FFFFFF" font-family="sans-serif" font-weight="800" font-size="20" letter-spacing="-0.5">BLESMPForge Pro</text>
  <rect x="270" y="22" width="220" height="22" rx="4" fill="#00E5FF" fill-opacity="0.12" stroke="#00E5FF" stroke-width="1"/>
  <text x="380" y="37" fill="#00E5FF" font-family="sans-serif" font-weight="700" font-size="11" text-anchor="middle">BLUETOOTH LE SECURITY MANAGER</text>

  <!-- Badges -->
  <rect x="910" y="20" width="135" height="26" rx="6" fill="#1a2333" stroke="#00E5FF" stroke-width="1"/>
  <text x="977" y="37" fill="#00E5FF" font-family="sans-serif" font-weight="700" font-size="12" text-anchor="middle">L2CAP CID 0x0006</text>
  <rect x="1060" y="20" width="115" height="26" rx="6" fill="#1a2333" stroke="#00E676" stroke-width="1"/>
  <text x="1117" y="37" fill="#00E676" font-family="sans-serif" font-weight="700" font-size="12" text-anchor="middle">10/10 PASS (100%)</text>

  <!-- Left Card: Pairing PDU Synthesizer & Association Model -->
  <rect x="30" y="85" width="560" height="555" rx="12" fill="url(#cardGrad)" stroke="#243247" stroke-width="1.5"/>
  <text x="50" y="120" fill="#00E5FF" font-family="sans-serif" font-weight="800" font-size="15" letter-spacing="0.5">PAIRING FEATURE EXCHANGE (PDU 0x01 / 0x02)</text>

  <g transform="translate(50, 140)">
    <!-- Row 1: Code and IO Cap -->
    <rect x="0" y="0" width="520" height="42" rx="6" fill="#0a0e17" stroke="#243247"/>
    <text x="15" y="26" fill="#8da4be" font-family="sans-serif" font-size="12">Command: <tspan fill="#00E5FF" font-weight="700">0x01 (Pairing Request)</tspan></text>
    <text x="260" y="26" fill="#8da4be" font-family="sans-serif" font-size="12">IO Cap: <tspan fill="#7C4DFF" font-weight="700">0x01 (DisplayYesNo)</tspan></text>

    <!-- Row 2: AuthReq Bitmask -->
    <rect x="0" y="50" width="520" height="42" rx="6" fill="#0a0e17" stroke="#243247"/>
    <text x="15" y="76" fill="#8da4be" font-family="sans-serif" font-size="12">AuthReq: <tspan fill="#00E676" font-weight="700">0x0D</tspan> [Bonding=1 | MITM=1 | SC=1]</text>
    <text x="320" y="76" fill="#8da4be" font-family="sans-serif" font-size="12">Key Size: <tspan fill="#00E5FF" font-weight="700">16 Octets (128-bit)</tspan></text>

    <!-- Row 3: Association Model Box -->
    <rect x="0" y="100" width="520" height="60" rx="6" fill="#0a0e17" stroke="#243247"/>
    <text x="15" y="124" fill="#8da4be" font-family="sans-serif" font-size="11">RESOLVED ASSOCIATION MODEL</text>
    <text x="15" y="146" fill="#00E676" font-family="sans-serif" font-weight="800" font-size="14">NUMERIC COMPARISON (P-256 ECDH Authenticated MITM Protection)</text>

    <!-- Row 4: Raw SMP Hex Stream -->
    <text x="0" y="185" fill="#8da4be" font-family="sans-serif" font-weight="700" font-size="11">SYNTHESIZED SMP PDU (7 OCTETS)</text>
    <rect x="0" y="195" width="520" height="50" rx="6" fill="#060910" stroke="#00E5FF" stroke-width="1.5"/>
    <text x="15" y="226" fill="#00E5FF" font-family="monospace" font-weight="700" font-size="14" letter-spacing="2">01 01 00 0D 10 07 07</text>

    <!-- Row 5: L2CAP Encapsulation -->
    <text x="0" y="270" fill="#8da4be" font-family="sans-serif" font-weight="700" font-size="11">L2CAP ENCAPSULATED FRAME (CID 0x0006 - 11 OCTETS)</text>
    <rect x="0" y="280" width="520" height="50" rx="6" fill="#060910" stroke="#7C4DFF" stroke-width="1.5"/>
    <text x="15" y="311" fill="#E040FB" font-family="monospace" font-weight="700" font-size="13" letter-spacing="1.5">07 00 06 00 01 01 00 0D 10 07 07</text>

    <!-- Row 6: Security Primitive Info -->
    <rect x="0" y="345" width="520" height="60" rx="6" fill="#0a0e17" stroke="#243247"/>
    <text x="15" y="368" fill="#8da4be" font-family="sans-serif" font-size="11">CRYPTOGRAPHIC ALGORITHMS</text>
    <text x="15" y="390" fill="#FFFFFF" font-family="sans-serif" font-size="12">FIPS P-256 ECDH Key Agreement | AES-CMAC f4 (Confirm), f5 (Key Gen), g2 (Numeric)</text>
  </g>

  <!-- Right Card: 10-Point Normative Auditor -->
  <rect x="610" y="85" width="560" height="555" rx="12" fill="url(#cardGrad)" stroke="#243247" stroke-width="1.5"/>
  <text x="630" y="120" fill="#00E676" font-family="sans-serif" font-weight="800" font-size="15" letter-spacing="0.5">10-POINT NORMATIVE ZERO-TRUST AUDITOR</text>

  <g transform="translate(630, 140)">
    <!-- Rule 1 -->
    <rect x="0" y="0" width="520" height="34" rx="4" fill="#0a0e17" stroke="#243247"/>
    <rect x="0" y="0" width="4" height="34" fill="#00E676"/>
    <text x="15" y="22" fill="#00E676" font-family="monospace" font-weight="700" font-size="11">[PASS]</text>
    <text x="65" y="22" fill="#f0f4f8" font-family="sans-serif" font-size="12">RULE-01: Fixed L2CAP CID 0x0006 Channel Routing</text>

    <!-- Rule 2 -->
    <rect x="0" y="42" width="520" height="34" rx="4" fill="#0a0e17" stroke="#243247"/>
    <rect x="0" y="42" width="4" height="34" fill="#00E676"/>
    <text x="15" y="64" fill="#00E676" font-family="monospace" font-weight="700" font-size="11">[PASS]</text>
    <text x="65" y="64" fill="#f0f4f8" font-family="sans-serif" font-size="12">RULE-02: Normative Key Size Bounds (7 &lt;= 16 &lt;= 16 Octets)</text>

    <!-- Rule 3 -->
    <rect x="0" y="84" width="520" height="34" rx="4" fill="#0a0e17" stroke="#243247"/>
    <rect x="0" y="84" width="4" height="34" fill="#00E676"/>
    <text x="15" y="106" fill="#00E676" font-family="monospace" font-weight="700" font-size="11">[PASS]</text>
    <text x="65" y="106" fill="#f0f4f8" font-family="sans-serif" font-size="12">RULE-03: Zero-Trust 128-Bit Minimum Key Strength (KNOB Immune)</text>

    <!-- Rule 4 -->
    <rect x="0" y="126" width="520" height="34" rx="4" fill="#0a0e17" stroke="#243247"/>
    <rect x="0" y="126" width="4" height="34" fill="#00E676"/>
    <text x="15" y="148" fill="#00E676" font-family="monospace" font-weight="700" font-size="11">[PASS]</text>
    <text x="65" y="148" fill="#f0f4f8" font-family="sans-serif" font-size="12">RULE-04: LE Secure Connections (SC) Mode Enforcement (P-256)</text>

    <!-- Rule 5 -->
    <rect x="0" y="168" width="520" height="34" rx="4" fill="#0a0e17" stroke="#243247"/>
    <rect x="0" y="168" width="4" height="34" fill="#00E676"/>
    <text x="15" y="190" fill="#00E676" font-family="monospace" font-weight="700" font-size="11">[PASS]</text>
    <text x="65" y="190" fill="#f0f4f8" font-family="sans-serif" font-size="12">RULE-05: Man-in-the-Middle (MITM) Protection Requirement Asserted</text>

    <!-- Rule 6 -->
    <rect x="0" y="210" width="520" height="34" rx="4" fill="#0a0e17" stroke="#243247"/>
    <rect x="0" y="210" width="4" height="34" fill="#00E676"/>
    <text x="15" y="232" fill="#00E676" font-family="monospace" font-weight="700" font-size="11">[PASS]</text>
    <text x="65" y="232" fill="#f0f4f8" font-family="sans-serif" font-size="12">RULE-06: Association Model Zero-Trust Risk (Numeric Comparison Safe)</text>

    <!-- Rule 7 -->
    <rect x="0" y="252" width="520" height="34" rx="4" fill="#0a0e17" stroke="#243247"/>
    <rect x="0" y="252" width="4" height="34" fill="#00E676"/>
    <text x="15" y="274" fill="#00E676" font-family="monospace" font-weight="700" font-size="11">[PASS]</text>
    <text x="65" y="274" fill="#f0f4f8" font-family="sans-serif" font-size="12">RULE-07: Key Distribution Bitmask Range (0x07 &lt;= 0x0F)</text>

    <!-- Rule 8 -->
    <rect x="0" y="294" width="520" height="34" rx="4" fill="#0a0e17" stroke="#243247"/>
    <rect x="0" y="294" width="4" height="34" fill="#00E676"/>
    <text x="15" y="316" fill="#00E676" font-family="monospace" font-weight="700" font-size="11">[PASS]</text>
    <text x="65" y="316" fill="#f0f4f8" font-family="sans-serif" font-size="12">RULE-08: PDU Length Alignment (Pairing Request is exactly 7B)</text>

    <!-- Rule 9 -->
    <rect x="0" y="336" width="520" height="34" rx="4" fill="#0a0e17" stroke="#243247"/>
    <rect x="0" y="336" width="4" height="34" fill="#00E676"/>
    <text x="15" y="358" fill="#00E676" font-family="monospace" font-weight="700" font-size="11">[PASS]</text>
    <text x="65" y="358" fill="#f0f4f8" font-family="sans-serif" font-size="12">RULE-09: Pairing Failed Error Code Taxonomy (0x01..0x0F)</text>

    <!-- Rule 10 -->
    <rect x="0" y="378" width="520" height="34" rx="4" fill="#0a0e17" stroke="#243247"/>
    <rect x="0" y="378" width="4" height="34" fill="#00E676"/>
    <text x="15" y="400" fill="#00E676" font-family="monospace" font-weight="700" font-size="11">[PASS]</text>
    <text x="65" y="400" fill="#f0f4f8" font-family="sans-serif" font-size="12">RULE-10: H7 CT2 Cross-Transport Derivation Consistency</text>
  </g>
</svg>
